<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baromètre Swisse Travel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, one step at a time for respondents; a wide consultant view behind a code. */
:root {
  /* Swisse Travel brand: navy #011a30 (logo, header text), burgundy #79162d (site buttons), red #fe211f (logo plane) */
  --bg: #f8fafc; --surface: #ffffff; --ink: #011a30; --muted: #4f5d6b; --line: #dde3ea;
  --accent: #79162d; --accent-soft: #f6e8eb; --brand-red: #e8231d; --good: #1f7a4d; --warn: #b7791f; --crit: #b4432f;
  --h1: #f6dcd6; --h2: #f7ead2; --h3: #dcefe3; --h4: #b9e0c9;
  --l1: #c2473a; --l2: #eda99e; --l3: #9fd3b4; --l4: #2f8f5b;
  --display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --body: "Open Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071423; --surface: #0e1f33; --ink: #e8eef5; --muted: #9aaabb; --line: #22364d;
    --accent: #e0607a; --accent-soft: #3a1622; --brand-red: #ff5a4f; --good: #5bc48a; --warn: #e0a64a; --crit: #ec7a63;
    --h1: #4a2620; --h2: #47391d; --h3: #1f3d2c; --h4: #245a3d; --l1: #e0675a; --l2: #8a4a43; --l3: #2f6b4b; --l4: #5bc48a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071423; --surface: #0e1f33; --ink: #e8eef5; --muted: #9aaabb; --line: #22364d;
  --accent: #e0607a; --accent-soft: #3a1622; --brand-red: #ff5a4f; --good: #5bc48a; --warn: #e0a64a; --crit: #ec7a63;
  --h1: #4a2620; --h2: #47391d; --h3: #1f3d2c; --h4: #245a3d; --l1: #e0675a; --l2: #8a4a43; --l3: #2f6b4b; --l4: #5bc48a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
.narrow { max-width: 680px; margin: 0 auto; }
.wide { max-width: 1180px; margin: 0 auto; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-red); font-weight: 600; }
.brandbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
.brandbar .logo { display: inline-flex; background: #ffffff; border-radius: 10px; padding: 6px 10px; }
.brandbar .logo img { height: 42px; width: auto; display: block; }
.brandbar .tagline { font-size: 12px; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; font-size: clamp(28px, 5vw, 38px); line-height: 1.12; margin: 6px 0 10px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; align-content: start; }
.stack { display: grid; gap: 14px; }
.steps { display: flex; gap: 6px; margin: 18px 0 14px; }
.steps span { flex: 1; height: 5px; border-radius: 999px; background: var(--line); }
.steps span.on { background: var(--accent); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; }
input[type="text"], input[type="password"], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input[type="text"]:focus-visible, input[type="password"]:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { min-height: 110px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg input, .scale input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--bg); font-weight: 500; }
.seg input:checked + label { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.seg input:focus-visible + label, .scale input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.q { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; padding-bottom: 0; }
.qn { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.scale { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.scale label { display: grid; place-items: center; text-align: center; font-size: 13px; line-height: 1.2; padding: 8px 4px; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); color: var(--muted); }
.scale label:hover { border-color: var(--accent); }
.scale input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
button, .btn { font: inherit; cursor: pointer; border-radius: 10px; padding: 11px 16px; border: 1px solid var(--accent); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--surface); font-weight: 600; }
.ghost { background: transparent; color: var(--accent); }
.danger { background: transparent; color: var(--crit); border-color: var(--crit); padding: 5px 10px; font-size: 13px; }
.error { color: var(--crit); font-size: 13px; min-height: 1.2em; }
.ok { color: var(--good); font-size: 13px; min-height: 1.2em; }
.codebox { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; overflow-wrap: anywhere; }
.footer-link { margin-top: 28px; text-align: center; font-size: 12px; }
.footer-link a { color: var(--muted); }
/* consultant view */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--mono); font-size: 28px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.dimrow { display: grid; gap: 6px; }
.dimtop { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; }
.pair { display: grid; grid-template-columns: 74px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.pair .num { font-family: var(--mono); text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.btrack { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bfill { height: 100%; border-radius: 999px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.list li { border-left: 3px solid var(--crit); padding: 1px 0 1px 10px; font-size: 14px; }
.list li .meta { display: block; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--surface); }
td.name, th.name { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
td.c1 { background: var(--h1); } td.c2 { background: var(--h2); } td.c3 { background: var(--h3); } td.c4 { background: var(--h4); }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.comments { display: grid; gap: 10px; }
.comment { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); font-size: 14px; }
.comment b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.qlegend { font-size: 12px; color: var(--muted); columns: 2; column-gap: 24px; margin-top: 10px; }
@media (max-width: 760px) { .qlegend { columns: 1; } }
.qlegend div { break-inside: avoid; margin-bottom: 3px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.effin { width: 64px; padding: 2px 6px; font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
.pillset { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pillset button { border: 0; border-radius: 0; padding: 7px 14px; background: var(--surface); color: var(--muted); font-size: 13px; }
.pillset button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.insights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .insights { grid-template-columns: minmax(0, 1fr); } }
.insight { border-left: 3px solid var(--accent); background: var(--bg); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
.insight b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.gapnum { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lik { display: grid; gap: 7px; }
.likrow { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 46px; gap: 12px; align-items: center; font-size: 13px; }
@media (max-width: 760px) { .likrow { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.likrow .lt { min-width: 0; }
.likbar { display: grid; grid-template-columns: 1fr 1fr; height: 16px; }
.likbar .neg { display: flex; justify-content: flex-end; border-right: 1.5px solid var(--ink); }
.likbar .pos { display: flex; }
.likbar span { height: 100%; }
.likpct { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.likaxis { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 46px; gap: 12px; font-size: 11px; color: var(--muted); }
.likaxis div:nth-child(2) { display: flex; justify-content: space-between; }
@media (max-width: 760px) { .likaxis { grid-template-columns: minmax(0, 1fr); } .likaxis div:first-child, .likaxis div:last-child { display: none; } }
/* espace DIGIVAS : onglets, suivi, matrice, recommandations, livrables */
:root { --q1: #fbe9e6; --q2: #fcf3e2; --q3: #eef1f5; --q4: #e6f4ec; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --q1: #3a1e1b; --q2: #382d17; --q3: #172a3e; --q4: #173526; } }
:root[data-theme="dark"] { --q1: #3a1e1b; --q2: #382d17; --q3: #172a3e; --q4: #173526; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
@media (max-width: 760px) { .strip { grid-template-columns: minmax(0, 1fr); } }
.strip > div { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px; padding: 12px 14px; display: grid; gap: 3px; min-width: 0; }
.strip b { font-family: var(--display); font-weight: 600; font-size: 16px; }
.wk { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 4px; }
.wk span { height: 6px; border-radius: 2px; background: var(--line); }
.wk span.on { background: var(--accent); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs a { padding: 10px 14px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mxwrap { overflow-x: auto; }
.mx { width: 100%; min-width: 520px; height: auto; display: block; }
.mx .qt { font-size: 11px; fill: var(--muted); font-weight: 600; }
.mx .ax { font-size: 11px; fill: var(--muted); }
.mx .pl { font-size: 10px; fill: var(--ink); font-family: var(--mono); }
.mx circle { stroke: var(--surface); stroke-width: 1.5; }
.mx .d1 { fill: var(--crit); } .mx .d2 { fill: var(--warn); } .mx .d3 { fill: var(--good); }
.synth { font-size: 15px; line-height: 1.65; max-width: 80ch; }
.dimreco { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 980px) { .dimreco { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .dimreco { grid-template-columns: minmax(0, 1fr); } }
.dimreco .card { padding: 14px 16px; gap: 8px; }
.score { white-space: nowrap; font-family: var(--mono); font-size: 13px; padding: 1px 8px; border-radius: 999px; }
.score.s0 { background: var(--h1); } .score.s1 { background: var(--h2); } .score.s2 { background: var(--h3); }
.rgroup { margin: 26px 0 12px; }
.rgroup h2 { font-size: 20px; }
.rcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .rcards { grid-template-columns: minmax(0, 1fr); } }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.rtop { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.rq { font-weight: 600; }
.rr { border-left: 3px solid var(--accent); padding-left: 10px; }
.rbot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.rbot a { color: var(--accent); font-weight: 600; text-decoration: none; }
.pt { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.pt.crit { background: var(--h1); color: var(--crit); } .pt.warn { background: var(--h2); color: var(--warn); } .pt.mod { background: var(--q3); color: var(--muted); }
.probes { margin: 0; padding-left: 20px; display: grid; gap: 10px; }
.probes li b { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.livs { display: grid; gap: 10px; }
.liv { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.liv:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 760px) { .liv { grid-template-columns: minmax(0, 1fr); } }
.liv.late .meta { color: var(--crit); font-weight: 600; }
.lmain { display: grid; gap: 4px; min-width: 0; }
.ltitle { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.liv .meta { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.lside { display: grid; gap: 8px; align-content: start; }
.lside .nav { justify-content: flex-end; }
.lside .btn { padding: 7px 12px; font-size: 13px; }
select.st { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
select.st-en_cours { border-color: var(--warn); } select.st-remis { border-color: var(--accent); } select.st-valide { border-color: var(--good); background: var(--h3); }
.lnote { font-size: 13px !important; padding: 7px 10px !important; }
.doclist { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
/* vue document */
.docwrap { max-width: 860px; margin: 0 auto; }
.docbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.docbar button, .docbar .btn { padding: 8px 12px; font-size: 13px; }
.doctip { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.nextup { display: grid; gap: 10px; margin-top: 6px; }
.nu { display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px; }
.nu.late { border-left-color: var(--crit); }
.nu > div { display: grid; gap: 3px; min-width: 0; }
.nu .btn { padding: 7px 12px; font-size: 13px; white-space: nowrap; }
.acts { display: grid; }
.act { display: grid; grid-template-columns: 34px minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.act:first-child { border-top: 0; }
.act.late .meta { color: var(--crit); font-weight: 600; }
.act.done .lmain b { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.an { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--q3); font-family: var(--mono); font-size: 12px; font-weight: 600; }
.act.done .an { background: var(--h3); color: var(--good); }
.act.late .an { background: var(--h1); color: var(--crit); }
.act .meta, .lmain .meta { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.sig { font-size: 12px; color: var(--muted); font-family: var(--mono); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
@media (max-width: 760px) { .act { grid-template-columns: 30px minmax(0, 1fr); } .act .lside { grid-column: 2; } .nu { flex-direction: column; align-items: stretch; } }
.res { display: grid; gap: 0; }
.rrow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, .7fr) minmax(0, .7fr) auto 70px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.rrow.dec { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.4fr) auto 70px; }
.rrow > div { display: grid; gap: 2px; min-width: 0; }
.rrow input[type=text] { font-size: 13px; padding: 7px 10px; }
@media (max-width: 760px) { .rrow, .rrow.dec { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .rrow > div { grid-column: 1 / -1; } }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; }
.gov { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
@media (max-width: 860px) { .gov { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.gov > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.gov > div.past { opacity: .6; }
/* doc-start */
.doc { background: #ffffff; color: #011a30; font-family: "Open Sans", Calibri, Arial, sans-serif; font-size: 13px; line-height: 1.55; padding: 40px 48px; border: 1px solid #dde3ea; border-radius: 6px; box-shadow: 0 8px 30px rgba(1,26,48,.08); outline: none; }
.doc .dh { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 3px solid #79162d; }
.doc .dh img { height: 40px; width: auto; }
.doc .dhr { text-align: right; font-size: 11px; color: #4f5d6b; }

const brandBar = () => el("div", { class: "brandbar" }, el("span", { class: "logo" }, el("img", { src: LOGO, alt: "Swisse Travel", width: "177", height: "42" })), el("span", { class: "tagline", text: "Plus qu'un voyage, une expérience" }));
const clean = s => String(s || "").replace(/[|\r\n]+/g, " ").replace(/\s+/g, " ").trim();

/* ---------- Respondent flow ---------- */
const state = { step: 0, name: "", role: "", answers: new Array(20).fill(null), comment: "" };

function stepBar() { return el("div", { class: "steps", "aria-hidden": "true" }, [0,1,2,3,4,5].map(i => el("span", { class: i <= state.step ? "on" : "" }))); }

function renderRespondent() {
  app.textContent = "";
  const wrap = el("div", { class: "narrow" });
  wrap.append(brandBar());
  wrap.append(el("div", { class: "eyebrow", text: "Accompagnement RH · Diagnostic" }));
  if (state.step === 0) renderIntro(wrap);
  else if (state.step <= 4) renderDim(wrap, state.step - 1);
  else if (state.step === 5) renderComment(wrap);
  else renderThanks(wrap);
  wrap.append(el("div", { class: "footer-link" }, el("span", { class: "muted", text: "Questionnaire proposé par Lamia Adel, consultante RH · " }), el("a", { href: "#espace-digivas", text: "Espace consultante" })));
  app.append(wrap);
  window.scrollTo(0, 0);
}

function renderIntro(wrap) {
  wrap.append(el("h1", { text: "Baromètre de l'organisation" }));
  wrap.append(el("p", { class: "muted", text: "Vingt affirmations sur la façon dont l'agence fonctionne au quotidien. Pour chacune, indiquez si elle correspond à ce que vous vivez. Il n'y a pas de bonne ou de mauvaise réponse : c'est votre regard qui compte." }));
  wrap.append(stepBar());
  const err = el("p", { class: "error", role: "alert" });
  const nameIn = el("input", { type: "text", id: "nom", autocomplete: "name", maxlength: "60", placeholder: "Ex. Fatima Zahra Alaoui", value: state.name });
  const seg = el("div", { class: "seg", role: "radiogroup", "aria-label": "Profil" },
    ["Direction", "Équipe"].flatMap((r, i) => {
      const inp = el("input", { type: "radio", name: "role", id: "role-" + i, value: r });
      if (state.role === r) inp.checked = true;
      return [inp, el("label", { for: "role-" + i, text: r === "Direction" ? "Direction" : "Membre de l'équipe" })];
    }));
  const card = el("div", { class: "card" },
    el("div", { class: "field" }, el("label", { for: "nom", text: "Votre prénom et votre nom" }), nameIn),
    el("div", { class: "field" }, el("span", { style: "font-weight:600", text: "Vous répondez en tant que" }), seg),
    el("p", { class: "small", text: "Vos réponses individuelles sont lues uniquement par la consultante RH. Elles servent à préparer le diagnostic de l'organisation, pas à évaluer les personnes, et sont présentées à la direction de façon regroupée, dans le respect de la loi 09-08 sur la protection des données personnelles." }),
    el("p", { class: "small", text: "Durée : 5 minutes environ, en 5 étapes." }),
    err,
    el("div", { class: "nav" }, el("span"), el("button", { class: "primary", text: "Commencer", onclick: () => {
      const role = document.querySelector('input[name="role"]:checked');
      state.name = clean(nameIn.value);
      if (state.name.length < 2) { err.textContent = "Indiquez votre prénom et votre nom pour continuer."; nameIn.focus(); return; }
      if (!role) { err.textContent = "Choisissez votre profil pour continuer."; return; }
      state.role = role.value; state.step = 1; renderRespondent();
    }}))
  );
  wrap.append(card);
}

function renderDim(wrap, d) {
  const dim = DIMS[d];
  wrap.append(el("h1", { text: dim.name }));
  wrap.append(el("p", { class: "muted", text: "Étape " + (d + 1) + " sur 5. Répondez aux cinq affirmations pour continuer." }));
  wrap.append(stepBar());
  const card = el("div", { class: "card" });
  const list = el("div");
  dim.qs.forEach((text, k) => {
    const idx = d * 5 + k;
    const scale = el("div", { class: "scale", role: "radiogroup", "aria-label": text },
      SCALE.flatMap((lab, v) => {
        const id = "q" + idx + "-" + (v + 1);
        const inp = el("input", { type: "radio", name: "q" + idx, id, value: v + 1, onchange: () => { state.answers[idx] = v + 1; err.textContent = ""; } });
        if (state.answers[idx] === v + 1) inp.checked = true;
        return [inp, el("label", { for: id, text: lab })];
      }));
    list.append(el("div", { class: "q" }, el("p", {}, el("span", { class: "qn", text: String(idx + 1).padStart(2, "0") }), text), scale));
  });
  const err = el("p", { class: "error", role: "alert" });
  card.append(list, err, el("div", { class: "nav" },
    el("button", { class: "ghost", text: "Retour", onclick: () => { state.step--; renderRespondent(); } }),
    el("button", { class: "primary", text: "Continuer", onclick: () => {
      const missing = state.answers.slice(d * 5, d * 5 + 5).filter(v => v == null).length;
      if (missing) { err.textContent = missing === 1 ? "Il reste une affirmation sans réponse." : "Il reste " + missing + " affirmations sans réponse."; return; }
      state.step++; renderRespondent();
    }})));
  wrap.append(card);
}

function renderComment(wrap) {
  wrap.append(el("h1", { text: "Une dernière question" }));
  wrap.append(el("p", { class: "muted", text: "Étape 5 sur 5. Cette question est facultative." }));
  wrap.append(stepBar());
  const ta = el("textarea", { id: "commentaire", maxlength: "400", placeholder: "Par exemple : savoir qui suit un dossier quand le collègue est absent." });
  ta.value = state.comment;
  const err = el("p", { class: "error", role: "alert" });
  wrap.append(el("div", { class: "card" },
    el("div", { class: "field" }, el("label", { for: "commentaire", text: "Qu'est-ce qui vous ferait gagner le plus de temps ou d'énergie dans votre travail ?" }), ta),
    el("div", { class: "nav" },
      el("button", { class: "ghost", text: "Retour", onclick: () => { state.comment = ta.value; state.step--; renderRespondent(); } }),
      el("button", { class: "primary", id: "send-btn", text: "Envoyer mes réponses", onclick: async (e) => {

function renderThanks(wrap) {
  wrap.append(el("h1", { text: "Merci " + state.name.split(" ")[0] + "." }));

const lvlIdx = v => v == null ? 1 : v < 40 ? 0 : v < 70 ? 1 : 2;

function computeStats(list) {
  const nums = r => r.reponses.split("").map(Number);
  const dir = list.filter(r => r.profil === "Direction"), eq = list.filter(r => r.profil === "Équipe");
  const both = dir.length > 0 && eq.length > 0;
  const qAvg = (l, i) => l.length ? avg(l.map(r => Number(r.reponses[i]))) : null;
  const dimScore = (l, d) => scorePct(l.flatMap(r => nums(r).slice(d * 5, d * 5 + 5)));
  const allScore = l => scorePct(l.flatMap(nums));
  const q = ALLQ.map((t, i) => {
    const v = list.map(r => Number(r.reponses[i]));
    const a = v.length ? avg(v) : null;
    return { t, i, a, sd: v.length ? Math.sqrt(avg(v.map(x => (x - a) ** 2))) : 0,
      neg: v.length ? v.filter(x => x <= 2).length / v.length : 0,
      acc: v.length ? v.filter(x => x >= 3).length / v.length * 100 : 0,
      ad: qAvg(dir, i), ae: qAvg(eq, i), gap: both ? qAvg(dir, i) - qAvg(eq, i) : null };
  });
  const dims = DIMS.map((d, i) => ({ d, i, v: dimScore(list, i), vd: dimScore(dir, i), ve: dimScore(eq, i) }));
  return { n: list.length, dir, eq, both, q, dims, g: allScore(list), gd: allScore(dir), ge: allScore(eq) };
}

function recos(S) {
  return S.q.filter(o => o.a != null && (o.a < 3 || o.neg >= 0.34))
    .map(o => ({ ...o, ...RECO[o.i], prio: (4 - o.a) / 3 * 0.6 + o.neg * 0.4 + (o.gap != null ? Math.min(Math.abs(o.gap), 3) / 3 * 0.15 : 0) }))
    .sort((x, y) => y.prio - x.prio || x.i - y.i);
}
const prioLabel = p => p >= 0.6 ? ["Critique", "crit"] : p >= 0.4 ? ["Élevée", "warn"] : ["Modérée", "mod"];
const constat = o => "Moyenne " + fmt1(o.a) + " sur 4, " + Math.round(o.neg * 100) + " % des répondants ne sont pas d'accord" +
  (o.gap != null && Math.abs(o.gap) >= 1 ? ". Direction " + fmt1(o.ad) + ", équipe " + fmt1(o.ae) + "." : ".");

function synthese(S) {
  if (!S.n) return "Aucune réponse n'a encore été reçue.";
  const ds = [...S.dims].sort((a, b) => a.v - b.v);
  let t = "Avec " + S.n + " réponse" + (S.n > 1 ? "s" : "") + " (" + S.dir.length + " de la direction, " + S.eq.length + " de l'équipe), l'organisation obtient un score de " + S.g + " sur 100, au niveau « " + lvlLabel(S.g).toLowerCase() + " ». ";
  t += "La dimension la plus fragile est « " + ds[0].d.name + " » avec " + ds[0].v + " sur 100, et la plus solide « " + ds[3].d.name + " » avec " + ds[3].v + ". ";
  if (S.both) { const gap = S.gd - S.ge; t += Math.abs(gap) < 8 ? "La direction et l'équipe portent un regard proche sur l'organisation. " : gap > 0 ? "La direction voit l'organisation plus positivement que l'équipe, avec " + gap + " points d'écart, ce qui appelle une restitution attentive. " : "L'équipe est plus positive que la direction, avec " + (-gap) + " points d'écart. "; }
  const ch = [...new Set(recos(S).map(o => LIVMAP[o.liv] && LIVMAP[o.liv].t))].filter(Boolean).slice(0, 3).map(t => t.replace(/^./, c => c.toLowerCase()));
  if (ch.length) t += "Les chantiers à ouvrir en priorité sont : " + (ch.length > 1 ? ch.slice(0, -1).join(", ") + " et " + ch[ch.length - 1] : ch[0]) + ".";
  return t;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const F = (hint, w) => '<span class="fill"' + (w ? ' style="min-width:' + w + '"' : "") + ">" + (hint ? esc(hint) : "&nbsp;") + "</span>";
const T = (head, rows, cls) => '<table class="' + (cls || "") + '"><thead><tr>' + head.map(h => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" + rows.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
const blank = (n, cols) => Array.from({ length: n }, () => Array(cols).fill("&nbsp;"));
const H2 = (n, t, lead) => '<h2><span class="sn">' + String(n).padStart(2, "0") + "</span>" + t + "</h2>" + (lead ? '<p class="lead2">' + lead + "</p>" : "");
const BOX = (t, body) => '<div class="box"><b>' + t + "</b>" + body + "</div>";
const SIGN = (a, b) => '<table class="sign"><tr><td>' + a + "<br><br>Nom : " + F("") + "<br>Date et signature :</td><td>" + b + "<br><br>Nom : " + F("") + "<br>Date et signature :</td></tr></table>";

function docShell(lv, lead, inner) {
  return '<header class="dh"><img src="' + LOGO + '" alt="Swisse Travel"><div class="dhr"><div class="dk">Lamia Adel · Consultante RH</div><div>' + (lv.grp === "plan" ? "Livrable " + String(lv.n).padStart(2, "0") + " sur 12" : "Outil de mission") + (lv.a ? " · action " + lv.a + " du plan" : "") + (lv.recur ? " · chaque semaine" : " · échéance " + dshort(weekEnd(lv.w))) + "</div></div></header>" +
    '<div class="dtitle"><div class="eyb">' + PHASES[lv.ph] + "</div><h1>" + lv.t + '</h1><p class="lead">' + lead + "</p></div>" +
    '<table class="meta"><tr><td>Client</td><td>Swisse Travel, Salé</td><td>Version</td><td>' + F("v1") + "</td></tr><tr><td>Préparé par</td><td>Lamia Adel, consultante RH</td><td>Date</td><td>" + dfmt(new Date()) + "</td></tr></table>" +
    inner + '<footer class="df">Lamia Adel, consultante RH · Mission RH Swisse Travel · Document de travail confidentiel</footer>';
}

function baroBlock(S, n0) {
  if (!S.n) return BOX("Aucune réponse pour l'instant", "<p>Cette partie se remplira automatiquement dès les premières réponses au baromètre. Rouvrez le modèle et choisissez « Régénérer » pour l'actualiser.</p>");
  const lab = v => v == null ? "–" : v;
  let h = H2(n0, "Les résultats en bref", "Ce que l'équipe dit de l'organisation, dimension par dimension.");
  h += '<p>' + esc(synthese(S)) + "</p>";
  h += '<div class="kp"><div><b>' + S.n + "</b>réponses</div><div><b>" + S.g + "</b>score global sur 100</div><div><b>" + (S.both ? signed(S.gd - S.ge) : "–") + "</b>écart direction – équipe</div><div><b>" + esc(lvlLabel(S.g)) + "</b>niveau d'ensemble</div></div>";
  h += T(["Dimension", "Direction", "Équipe", "Écart", "Ensemble", "Niveau"], S.dims.map(x => [esc(x.d.name), lab(x.vd), lab(x.ve), x.vd != null && x.ve != null ? signed(x.vd - x.ve) : "–", "<b>" + x.v + "</b>", esc(lvlLabel(x.v))]), "num");
  h += '<p class="note">Scores sur 100 : moins de 40, à structurer ; de 40 à 69, en construction ; 70 et plus, solide.</p>';
  h += H2(n0 + 1, "Ce que disent les chiffres", "Une lecture par dimension.");
  h += "<ul>" + S.dims.map(x => "<li><b>" + esc(x.d.name) + " (" + x.v + ").</b> " + esc(DIMTXT[x.d.id][lvlIdx(x.v)]) + "</li>").join("") + "</ul>";
  const weak = [...S.q].sort((a, b) => a.a - b.a || a.i - b.i).slice(0, 5);
  h += "<h3>Les cinq points les plus faibles</h3>" + T(["", "Affirmation", "Moyenne sur 4", "Pas d'accord"], weak.map(o => [qn(o.i), esc(o.t), fmt1(o.a), Math.round(o.neg * 100) + " %"]), "num2");
  if (S.both) {
    const gaps = S.q.filter(o => Math.abs(o.gap) >= 1).sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap)).slice(0, 5);
    h += "<h3>Où la direction et l'équipe voient les choses différemment</h3>" + (gaps.length ? T(["", "Affirmation", "Direction", "Équipe"], gaps.map(o => [qn(o.i), esc(o.t), fmt1(o.ad), fmt1(o.ae)]), "num2") : "<p>Aucun écart d'un point ou plus sur l'échelle de 1 à 4.</p>");
  }
  const coms = rows.filter(r => r.commentaire);
  if (coms.length) h += "<h3>Ce qui ferait gagner du temps, selon l'équipe</h3>" + coms.map(r => '<p class="verb">« ' + esc(r.commentaire) + " »</p>").join("");
  return h;
}

function recoTable(S, max) {
  const R = recos(S).slice(0, max || 8);
  if (!R.length) return "<p>Aucun point ne passe sous le seuil d'alerte. Les actions du plan servent alors à formaliser et consolider ce qui fonctionne.</p>";
  return T(["Priorité", "Constat", "Recommandation", "Action du plan", "Échéance"], R.map(o => ['<span class="pt ' + prioLabel(o.prio)[1] + '">' + prioLabel(o.prio)[0] + "</span>", "<b>" + qn(o.i) + "</b> " + esc(o.t) + '<br><span class="note">' + esc(constat(o)) + "</span>", esc(o.r), "n° " + o.act + " · " + esc(ACTIONS[o.act][1]), ACTIONS[o.act][0]]));
}

  "charte-ia": lv => docShell(lv, "Les règles communes pour utiliser les outils d'intelligence artificielle sans mettre en risque les clients ni l'agence. Chaque salarié la lit, pose ses questions lors de l'atelier, puis la signe.",
    H2(1, "Pourquoi cette charte") + "<p>Les outils d'IA font gagner du temps pour rédiger, traduire et résumer. Ils peuvent aussi se tromper avec assurance et conserver ce qu'on y saisit. Cette charte fixe ce que l'on peut leur confier, ce que l'on ne leur confie jamais et qui vérifie avant l'envoi au client.</p>" +
    H2(2, "Les outils autorisés") + T(["Outil", "Usage autorisé", "Compte"], [[F("nom de l'outil"), F(""), F("compte de l'agence")], ["&nbsp;", "&nbsp;", "&nbsp;"]]) + '<p class="note">Seuls les outils de cette liste sont utilisés pour le travail, avec un compte de l\'agence et non un compte personnel.</p>' +
    H2(3, "Ce que l'on peut confier à l'IA") + "<ul><li>Préparer un brouillon de réponse à une question fréquente, sans données personnelles.</li><li>Rédiger ou reformuler une fiche offre à partir des informations validées.</li><li>Traduire un texte en arabe, en français ou en anglais.</li><li>Résumer un document interne ou préparer un support de réunion.</li></ul>" +
    H2(4, "Ce que l'on ne confie jamais à l'IA") + "<ul><li>Un numéro de passeport, de carte d'identité ou de visa, une photo d'identité ou une copie de document.</li><li>Une information de santé, une donnée bancaire ou le contenu d'un paiement.</li><li>Le nom complet d'un client associé à son dossier, sauf dans un outil validé par la direction pour cet usage.</li><li>Les prix d'achat, les contrats fournisseurs et les données financières de l'agence.</li></ul>" +
    H2(5, "La règle de relecture") + "<p>Aucun texte produit avec l'IA n'est envoyé à un client sans relecture par la personne qui l'envoie. Les prix, les dates, les horaires et les conditions sont toujours vérifiés dans le logiciel de réservation, jamais repris tels quels de l'outil. En cas de doute, on demande à " + F("nom du référent numérique") + ".</p>" +
    H2(6, "Les données personnelles des clients") + "<p>Les données des pèlerins sont protégées par la loi 09-08 relative à la protection des personnes physiques à l'égard du traitement des données à caractère personnel, sous le contrôle de la CNDP. Concrètement, à l'agence :</p><ul><li>on ne collecte que les informations nécessaires au voyage ;</li><li>les copies de documents reçues sur WhatsApp sont enregistrées dans le dossier client, puis supprimées du téléphone ;</li><li>on ne transmet jamais les données d'un client à un tiers qui n'en a pas besoin pour le voyage ;</li><li>un client qui demande à consulter ou corriger ses données est orienté vers " + F("nom") + ".</li></ul>" +
    H2(7, "Sécurité et signalement") + "<p>Chacun protège son compte par un mot de passe personnel. Une erreur, un envoi au mauvais destinataire ou une fuite de données est signalé le jour même à " + F("nom") + ", sans crainte de sanction pour celui qui signale de bonne foi.</p>" +
    BOX("Engagement", "<p>J'ai lu cette charte, j'en ai compris les règles et je m'engage à les appliquer.</p>" + T(["Nom", "Poste", "Date", "Signature"], blank(8, 4), "tall"))),

/* ---------- Matrice des priorités ---------- */
function matrixCard(sel) {
  const S = computeStats(sel);
  const W = 640, H = 340, L = 46, R = 36, Tp = 16, B = 40;
  const X = v => L + v / 100 * (W - L - R), Y = c => Tp + (1 - c) * (H - Tp - B);
  const pts = S.q.map(o => ({ ...o, cx: X(o.acc), cy: Y(Math.max(0, 1 - o.sd / 1.5)) }));
  const ns = "http://www.w3.org/2000/svg";
  const s = (tag, a, txt) => { const n = document.createElementNS(ns, tag); for (const k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; return n; };
  const svg = s("svg", { viewBox: "0 0 " + W + " " + H, class: "mx", role: "img", "aria-label": "Matrice des priorités : niveau d'accord et consensus pour chaque affirmation" });
  const quad = [[L, Tp, X(50) - L, Y(0.5) - Tp, "var(--q1)", "Problème reconnu par tous · agir vite"], [L, Y(0.5), X(50) - L, H - B - Y(0.5), "var(--q2)", "Vécus différents · creuser en entretien"], [X(50), Tp, W - R - X(50), Y(0.5) - Tp, "var(--q4)", "Acquis partagé · à préserver"], [X(50), Y(0.5), W - R - X(50), H - B - Y(0.5), "var(--q3)", "Avis partagés · à vérifier"]];
  quad.forEach(q => { svg.append(s("rect", { x: q[0], y: q[1], width: q[2], height: q[3], fill: q[4] })); svg.append(s("text", { x: q[0] + 8, y: q[1] === Tp ? q[1] + 16 : q[1] + q[3] - 8, class: "qt" }, q[5])); });
  [0, 25, 50, 75, 100].forEach(v => svg.append(s("text", { x: X(v), y: H - B + 16, "text-anchor": "middle", class: "ax" }, v + " %")));
  svg.append(s("text", { x: (L + W - R) / 2, y: H - 6, "text-anchor": "middle", class: "ax" }, "Part des répondants d'accord →"));
  svg.append(s("text", { x: 12, y: (Tp + H - B) / 2, transform: "rotate(-90 12 " + (Tp + H - B) / 2 + ")", "text-anchor": "middle", class: "ax" }, "Consensus →"));
  const groups = new Map();
  pts.forEach(p => { const k = Math.round(p.cx / 3) + "|" + Math.round(p.cy / 3); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
  const placed = [];
  [...groups.values()].sort((a, b) => a[0].cy - b[0].cy || a[0].cx - b[0].cx).forEach(gp => {
    const p = gp[0], g = s("g", {});
    g.append(s("title", {}, gp.map(o => qn(o.i) + " · " + o.t).join("\n") + "\n" + Math.round(p.acc) + " % d'accord"));
    g.append(s("circle", { cx: p.cx, cy: p.cy, r: 4.5 + Math.min(3, gp.length - 1), class: p.acc < 50 && p.sd <= 0.75 ? "d1" : p.acc < 50 ? "d2" : "d3" }));
    let ly = p.cy + 4; const lab = gp.map(o => qn(o.i)).join(" · "), lw = lab.length * 6.2;
    while (placed.some(b => Math.abs(b.y - ly) < 11 && p.cx + 9 < b.x + b.w && b.x < p.cx + 9 + lw)) ly += 11;
    placed.push({ x: p.cx + 9, y: ly, w: lw });
    g.append(s("text", { x: p.cx + 9, y: ly, class: "pl" }, lab));
    svg.append(g);
  });
  const act = pts.filter(p => p.acc < 50 && p.sd <= 0.75).sort((a, b) => a.acc - b.acc);
  return el("div", { class: "card", style: "margin-bottom:16px" },
    el("h3", { text: "Matrice des priorités" + (filt === "Tous" ? "" : " · " + filt) }),
    el("p", { class: "small", text: "Chaque point est une affirmation. À gauche, la majorité n'est pas d'accord ; en haut, les réponses se ressemblent. Le coin supérieur gauche réunit les problèmes que tout le monde reconnaît : ce sont les actions à lancer en premier." }),
    el("div", { class: "mxwrap" }, svg),
    act.length ? el("ul", { class: "list" }, act.slice(0, 5).map(o => el("li", {}, o.t, el("span", { class: "meta", text: qn(o.i) + " · " + Math.round(o.acc) + " % d'accord · action n° " + RECO[o.i].act + " du plan" })))) : el("p", { class: "small", text: "Aucune affirmation dans la zone « agir vite » pour l'instant." }));
}

/* ---------- Recommandations ---------- */
function drawReco(body) {
  const S = computeStats(rows);
  if (!S.n) { body.append(el("div", { class: "card empty" }, el("p", { text: "Les recommandations se construisent automatiquement à partir des réponses. Elles apparaîtront dès la première réponse reçue." }))); return; }
  const R = recos(S);
  body.append(el("div", { class: "card", style: "margin-bottom:16px" }, el("h3", { text: "Synthèse à présenter" }), el("p", { class: "synth", text: synthese(S) }),
    el("div", { class: "nav" }, el("span", { class: "small", text: "Le rapport de restitution reprend cette synthèse, les scores et les recommandations, sans aucun nom." }), el("a", { class: "btn primary", href: "#espace-digivas/doc/restitution", text: "Ouvrir la restitution" }))));
  body.append(el("div", { class: "dimreco" }, S.dims.map(x => el("div", { class: "card" },
    el("div", { class: "dimtop" }, el("span", { text: x.d.name }), el("span", { class: "score s" + lvlIdx(x.v), text: x.v + " / 100" })),
    el("p", { class: "small", text: DIMTXT[x.d.id][lvlIdx(x.v)] })))));
  if (!R.length) body.append(el("div", { class: "card empty", style: "margin-top:16px" }, el("p", { text: "Aucune affirmation ne passe sous le seuil d'alerte (moyenne inférieure à 3 sur 4 ou plus d'un tiers de désaccord). Les actions du plan servent alors à consolider l'existant." })));
  Object.entries(HOR).forEach(([h, [t, s]]) => {
    const list = R.filter(o => o.h === h); if (!list.length) return;
    body.append(el("div", { class: "rgroup" }, el("div", {}, el("h2", { text: t }), el("span", { class: "small", text: s + " · " + list.length + " recommandation" + (list.length > 1 ? "s" : "") }))));
    body.append(el("div", { class: "rcards" }, list.map(o => {
      const [pl, pc] = prioLabel(o.prio), lv = LIVMAP[o.liv];
      return el("div", { class: "rcard" },
        el("div", { class: "rtop" }, el("span", { class: "pt " + pc, text: pl }), el("span", { class: "qn", text: qn(o.i) + " · action n° " + o.act + " · " + ACTIONS[o.act][0] })),
        el("p", { class: "rq", text: "« " + o.t + " »" }),
        el("p", { class: "small", text: constat(o) }),
        el("p", { class: "rr", text: o.r }),
        el("div", { class: "rbot" }, el("span", { class: "small", text: "Pilote : " + ACTIONS[o.act][2] }), lv ? el("a", { href: "#espace-digivas/doc/" + lv.k, text: "Livrable : " + lv.t + " →" }) : null));
    })));
  });
  const probes = [...S.q].sort((a, b) => b.neg - a.neg || a.a - b.a).slice(0, 4).concat(S.both ? S.q.filter(o => Math.abs(o.gap) >= 1).sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap)).slice(0, 2) : []);
  const uniq = [...new Map(probes.map(o => [o.i, o])).values()];
  body.append(el("div", { class: "card", style: "margin-top:16px" }, el("h3", { text: "Questions à poser pendant les entretiens" }),
    el("p", { class: "small", text: "Tirées des affirmations les plus contestées et des plus grands écarts entre direction et équipe. Elles sont reprises dans le guide d'entretien." }),
    el("ol", { class: "probes" }, uniq.map(o => el("li", {}, el("b", { text: qn(o.i) + " · " + o.t }), el("span", { text: RECO[o.i].p })))),
    el("div", { class: "nav" }, el("span"), el("a", { class: "btn ghost", href: "#espace-digivas/doc/entretien", text: "Ouvrir le guide d'entretien" }))));
}

/* ---------- Livrables ---------- */
function drawLivrables(body, grp) {
  const today = new Date(new Date().toDateString());
  const ALL = LIVS.filter(l => l.grp === grp);
  const sent = ALL.filter(l => ["remis", "valide"].includes((suivi[l.k] || {}).statut)).length;
  body.append(el("div", { class: "card", style: "margin-bottom:16px" },
    el("div", { class: "dimtop" }, el("h3", { text: grp === "plan" ? "Les douze livrables du plan" : "Les outils de la consultante" }), el("span", { class: "gapnum", text: grp === "plan" ? sent + " sur " + ALL.length + " remis" : ALL.length + " outils" })),
    grp === "plan" ? el("div", { class: "btrack" }, el("div", { class: "bfill", style: "width:" + Math.round(sent / ALL.length * 100) + "%;background:var(--good)" })) : null,
    el("p", { class: "small", text: grp === "plan" ? "Les livrables remis à la direction, tels que le plan d'action les annonce. Chaque brouillon s'ouvre aux couleurs de Swisse Travel, se complète à l'écran, s'enregistre dans l'espace et s'imprime en PDF ou se télécharge pour Word. Ceux marqués « données du baromètre » se remplissent avec les réponses reçues." : "Les documents de travail qui servent à produire les livrables : réunions, entretiens, relevés, contrôles et comités. Ceux marqués « généré » se préparent à partir du plan d'action et de son avancement." })));
  PHASES.forEach((ph, pi) => {
    const list = ALL.filter(l => l.ph === pi);
    if (!list.length) return;
    body.append(el("div", { class: "card", style: "margin-bottom:16px" }, el("h3", { text: ph }),
      el("div", { class: "livs" }, list.map(l => {
        const s = suivi[l.k] || {}, st = s.statut || "a_faire", due = weekEnd(l.w);
        const late = !l.recur && due < today && !["remis", "valide"].includes(st);
        const msg = el("span", { class: "ok" });
        const save = async (patch) => {
          msg.textContent = "Enregistrement…"; msg.className = "small";
          try { await sb("rpc/digivas_suivi_maj", { p_mission: MISSION, p_code: code, p_cle: l.k, ...patch }); suivi[l.k] = { ...s, ...Object.fromEntries(Object.entries(patch).map(([k, v]) => [k.slice(2), v])) }; msg.textContent = "Enregistré"; msg.className = "ok"; }
          catch (x) { if (denied(x)) return lockOut("Le code n'est plus valide."); msg.textContent = "Échec de l'enregistrement"; msg.className = "error"; }
        };
        const selEl = el("select", { "aria-label": "Statut : " + l.t, class: "st st-" + st, onchange: e => { e.target.className = "st st-" + e.target.value; save({ p_statut: e.target.value }); } }, STATUTS.map(([v, t]) => el("option", { value: v, text: t, selected: v === st })));
        const note = el("input", { type: "text", class: "lnote", maxlength: "300", placeholder: "Note : prochaine étape, retour du client…", value: s.note || "", "aria-label": "Note : " + l.t });
        note.addEventListener("change", () => save({ p_note: note.value.trim() }));
        return el("div", { class: "liv" + (late ? " late" : "") },
          el("div", { class: "lmain" },
            el("div", { class: "ltitle" }, el("span", { class: "qn", text: (grp === "plan" ? "L" : "O") + String(LIVMAP[l.k].n).padStart(2, "0") }), el("b", { text: l.t }), l.auto ? el("span", { class: "tag", text: ["point-suivi", "comite"].includes(l.k) ? "généré" : "données du baromètre" }) : null, s.a_contenu ? el("span", { class: "tag", text: "version enregistrée" }) : null),
            el("p", { class: "small", text: l.d }),
            el("span", { class: "meta", text: (l.a ? "Action n° " + l.a + " · " : "") + (l.recur ? "chaque semaine" : "échéance " + dfmt(due)) + (late ? " · en retard" : "") })),
          el("div", { class: "lside" }, selEl, note, el("div", { class: "nav" }, msg, el("a", { class: "btn ghost", href: "#espace-digivas/doc/" + l.k, text: "Ouvrir le modèle" }))));
      }))));
  });
}

/* ---------- Méthode ---------- */
function drawMethode(body) {
  const sec = (t, ...kids) => el("div", { class: "card", style: "margin-bottom:16px" }, el("h3", { text: t }), ...kids);
  const p = t => el("p", { text: t });
  const ul = items => el("ul", { class: "doclist" }, items.map(t => el("li", { text: t })));
  body.append(el("div", { class: "grid2" },
    sec("Ce que mesure le baromètre", p("Vingt affirmations réparties en quatre dimensions de cinq affirmations : rôles et responsabilités, processus et passations, pilotage et reconnaissance, compétences et outils. Chaque répondant indique son degré d'accord sur une échelle de 1 (pas du tout) à 4 (tout à fait). L'échelle paire évite la position neutre et oblige à se prononcer."),
      el("div", { class: "qlegend" }, DIMS.map((d, k) => el("div", {}, el("span", { class: "qn", text: "D" + (k + 1) }), d.name + " : " + qn(k * 5) + " à " + qn(k * 5 + 4))))),
    sec("Comment les scores sont calculés", p("Le score sur 100 transforme la moyenne des réponses : une moyenne de 1 donne 0, une moyenne de 4 donne 100, selon la formule (moyenne − 1) ÷ 3 × 100. Un score de dimension regroupe ses cinq affirmations, le score global les vingt."),
      ul(["Moins de 40 : à structurer, la pratique n'existe pas ou n'est pas partagée.", "De 40 à 69 : en construction, la pratique existe mais dépend des personnes.", "70 et plus : solide, la pratique est connue et appliquée."]))));
  body.append(el("div", { class: "grid2" },
    sec("Lire les écarts et la matrice", p("L'écart direction – équipe est la différence entre les deux scores, en points sur 100. Un écart positif signifie que la direction voit l'organisation plus favorablement que l'équipe. Sur une affirmation, un écart d'un point ou plus sur l'échelle de 1 à 4 est jugé notable."),
      p("La matrice des priorités croise la part des répondants d'accord et le consensus, mesuré par la dispersion des réponses. Un problème reconnu par tous se traite tout de suite ; un désaccord entre répondants se comprend d'abord en entretien.")),
    sec("Comment naissent les recommandations", p("Une recommandation apparaît quand une affirmation obtient une moyenne inférieure à 3 sur 4, ou quand plus d'un tiers des répondants n'est pas d'accord. Chacune est reliée à une action du plan et à un livrable."),
      ul(["Priorité = 60 % pour le niveau de désaccord moyen, 40 % pour la part de répondants en désaccord, et un bonus jusqu'à 15 % pour un écart direction – équipe.", "Critique à partir de 0,6, élevée à partir de 0,4, modérée en dessous.", "Ces règles orientent l'analyse ; le jugement de la consultante et les entretiens restent décisifs."]))));
  body.append(el("div", { class: "grid2" },
    sec("Confidentialité et données personnelles", ul(["Les réponses ne sont lisibles qu'avec le code de l'Espace consultante, vérifié par le serveur.", "Pour toute présentation à la direction, cocher « Masquer les noms » et utiliser la restitution, qui ne contient aucun nom.", "Ne jamais citer un commentaire qui permettrait de reconnaître son auteur.", "Une réponse peut être retirée à la demande de son auteur, depuis la carte des réponses.", "Les réponses sont conservées le temps de la mission, puis supprimées après le bilan de la semaine 12, conformément à l'esprit de la loi 09-08."])),
    sec("Déroulé de la restitution, en 60 minutes", ul(["10 min · Rappel de la démarche et de la participation.", "15 min · Les scores par dimension et la synthèse.", "15 min · Les écarts entre direction et équipe, présentés comme des différences de point de vue et non comme des fautes.", "15 min · Les recommandations prioritaires et les actions rapides.", "5 min · Les décisions attendues et la date du comité suivant."]))));
  body.append(el("div", { class: "grid2" },
    sec("Calendrier d'utilisation", ul(["Semaine 1 : envoi du lien à toute l'équipe par la direction, avec le message d'invitation.", "Semaines 1 et 2 : entretiens individuels, avec les questions tirées du baromètre.", "Fin de la semaine 2 : restitution à la direction.", "Semaine 12 : deuxième mesure avec le même questionnaire, pour un objectif de +15 points sur le score global."])),
    sec("Accès et liens utiles", p("Lien à envoyer à l'équipe : https://digivas-barometre.vercel.app"), p("Espace consultante : https://digivas-barometre.vercel.app/#espace-digivas"),
      p("Les statuts, les notes et les versions enregistrées des livrables sont conservés avec les résultats, et retrouvés depuis n'importe quel appareil avec le même code. Le bouton « Verrouiller » ferme l'accès sur l'appareil utilisé."))));
}

/* ---------- Vue document ---------- */
const sanitize = html => { const d = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html"); d.querySelectorAll("script,iframe,object,embed,link,meta,style").forEach(n => n.remove()); d.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || /javascript:/i.test(a.value)) n.removeAttribute(a.name); })); return d.body.firstChild.innerHTML; };

async function renderDoc(k) {
  const lv = LIVMAP[k];
  if (!lv) { location.hash = "#espace-digivas/livrables"; return; }
  clearInterval(timer);
  app.textContent = "";
  const msg = el("span", { class: "small" });
  const paper = el("article", { class: "doc", contenteditable: "true", spellcheck: "true", "aria-label": lv.t });
  const bar = el("div", { class: "docbar noprint" },
    el("a", { class: "btn ghost", href: "#espace-digivas/livrables", text: "← Livrables" }),
    el("div", { class: "nav" }, msg,
      el("button", { class: "ghost", text: lv.auto ? "Régénérer avec les dernières réponses" : "Revenir au modèle", onclick: async () => { paper.innerHTML = TPL[k](lv); try { await sb("rpc/digivas_suivi_maj", { p_mission: MISSION, p_code: code, p_cle: k, p_effacer: true }); } catch (e) {} msg.textContent = "Modèle rechargé, version enregistrée effacée."; } }),
      el("button", { class: "ghost", text: "Télécharger pour Word", onclick: () => exportWord(lv, paper) }),
      el("button", { class: "ghost", text: "Imprimer ou PDF", onclick: () => window.print() }),
      el("button", { class: "primary", text: "Enregistrer", onclick: async () => {
        msg.textContent = "Enregistrement…";
        const cur = (suivi[k] || {}).statut, ns = !cur || cur === "a_faire" ? "en_cours" : null;
        try { await sb("rpc/digivas_suivi_maj", { p_mission: MISSION, p_code: code, p_cle: k, p_contenu: paper.innerHTML, p_statut: ns }); suivi[k] = { ...(suivi[k] || {}), statut: ns || cur, a_contenu: true, updated_at: new Date().toISOString() }; msg.textContent = "Enregistré à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
        catch (x) { if (denied(x)) return lockOut("Le code n'est plus valide."); msg.textContent = "Échec de l'enregistrement : vérifiez la connexion."; }
      } })));
  const tip = el("p", { class: "doctip noprint", text: "Cliquez dans le document pour le compléter : les zones grisées en pointillés sont à remplir. Pensez à enregistrer avant de quitter la page." });
  app.append(el("div", { class: "docwrap" }, bar, tip, paper));
  paper.append(el("p", { class: "small", text: "Chargement du modèle…" }));
  try {
    if (!loadedOnce) { await load(code); await loadSuivi(); loadedOnce = true; }
    const saved = await sb("rpc/digivas_suivi_doc", { p_mission: MISSION, p_code: code, p_cle: k }, "return=representation");
    if (saved) { paper.innerHTML = sanitize(saved); msg.textContent = "Version enregistrée" + (suivi[k] && suivi[k].updated_at ? " le " + new Date(suivi[k].updated_at).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""); }
    else paper.innerHTML = TPL[k](lv);
  } catch (x) { if (denied(x)) return lockOut("Le code n'est plus valide."); paper.innerHTML = TPL[k](lv); msg.textContent = "Hors connexion : modèle vierge affiché."; }
  window.scrollTo(0, 0);
}

function exportWord(lv, paper) {
  const clone = paper.cloneNode(true);
  clone.querySelectorAll("img").forEach(i => i.replaceWith(Object.assign(document.createElement("b"), { textContent: "SWISSE TRAVEL" })));
  const css = [...document.querySelectorAll("style")].map(s => s.textContent).join("\n").match(/\/\* doc-start \*\/([\s\S]*?)\/\* doc-end \*\//);
  const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(lv.t) + "</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:10.5pt;color:#011a30}" + (css ? css[1] : "") + "</style></head><body><div class=\"doc\">" + clone.innerHTML + "</div></body></html>";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + html], { type: "application/msword" }));
  a.download = "Swisse-Travel_" + slug(lv.t) + ".doc"; document.body.append(a); a.click(); a.remove();
}

function route() {
  if (location.hash.startsWith("#espace-digivas")) { code ? renderConsultant() : renderGate(); }
  else { clearInterval(timer); renderRespondent(); }
}
window.addEventListener("hashchange", route);
route();
</script>
