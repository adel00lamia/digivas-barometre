<style>
/* Layout: one narrow column, one step at a time for respondents; a wide consultant view behind a code. */
:root {
  /* Swisse Travel brand: navy #011a30 (logo, header text), burgundy #79162d (site buttons), red #fe211f (logo plane) */
  --bg: #f8fafc; --surface: #ffffff; --ink: #011a30; --muted: #4f5d6b; --line: #dde3ea;
  --accent: #79162d; --accent-soft: #f6e8eb; --brand-red: #e8231d; --good: #1f7a4d; --warn: #b7791f; --crit: #b4432f;
  --h1: #f6dcd6; --h2: #f7ead2; --h3: #dcefe3; --h4: #b9e0c9;
  --l1: #c2473a; --l2: #eda99e; --l3: #9fd3b4; --l4: #2f8f5b;
  --display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --body: "Open Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071423; --surface: #0e1f33; --ink: #e8eef5; --muted: #9aaabb; --line: #22364d;
    --accent: #e0607a; --accent-soft: #3a1622; --brand-red: #ff5a4f; --good: #5bc48a; --warn: #e0a64a; --crit: #ec7a63;
    --h1: #4a2620; --h2: #47391d; --h3: #1f3d2c; --h4: #245a3d; --l1: #e0675a; --l2: #8a4a43; --l3: #2f6b4b; --l4: #5bc48a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #071423; --surface: #0e1f33; --ink: #e8eef5; --muted: #9aaabb; --line: #22364d;
  --accent: #e0607a; --accent-soft: #3a1622; --brand-red: #ff5a4f; --good: #5bc48a; --warn: #e0a64a; --crit: #ec7a63;
  --h1: #4a2620; --h2: #47391d; --h3: #1f3d2c; --h4: #245a3d; --l1: #e0675a; --l2: #8a4a43; --l3: #2f6b4b; --l4: #5bc48a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
.narrow { max-width: 680px; margin: 0 auto; }
.wide { max-width: 1180px; margin: 0 auto; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-red); font-weight: 600; }
.brandbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
.brandbar .logo { display: inline-flex; background: #ffffff; border-radius: 10px; padding: 6px 10px; }
.brandbar .logo img { height: 42px; width: auto; display: block; }
.brandbar .tagline { font-size: 12px; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; letter-spacing: -.01em; font-size: clamp(28px, 5vw, 38px); line-height: 1.12; margin: 6px 0 10px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; align-content: start; }
.stack { display: grid; gap: 14px; }
.steps { display: flex; gap: 6px; margin: 18px 0 14px; }
.steps span { flex: 1; height: 5px; border-radius: 999px; background: var(--line); }
.steps span.on { background: var(--accent); }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; }
input[type="text"], input[type="password"], textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
input[type="text"]:focus-visible, input[type="password"]:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { min-height: 110px; resize: vertical; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg input, .scale input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; background: var(--bg); font-weight: 500; }
.seg input:checked + label { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.seg input:focus-visible + label, .scale input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.q { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; padding-bottom: 0; }
.qn { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
.scale { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.scale label { display: grid; place-items: center; text-align: center; font-size: 13px; line-height: 1.2; padding: 8px 4px; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); color: var(--muted); }
.scale label:hover { border-color: var(--accent); }
.scale input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
button, .btn { font: inherit; cursor: pointer; border-radius: 10px; padding: 11px 16px; border: 1px solid var(--accent); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--surface); font-weight: 600; }
.ghost { background: transparent; color: var(--accent); }
.danger { background: transparent; color: var(--crit); border-color: var(--crit); padding: 5px 10px; font-size: 13px; }
.error { color: var(--crit); font-size: 13px; min-height: 1.2em; }
.ok { color: var(--good); font-size: 13px; min-height: 1.2em; }
.codebox { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; overflow-wrap: anywhere; }
.footer-link { margin-top: 28px; text-align: center; font-size: 12px; }
.footer-link a { color: var(--muted); }
/* consultant view */
.topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--mono); font-size: 28px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.dimrow { display: grid; gap: 6px; }
.dimtop { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; }
.pair { display: grid; grid-template-columns: 74px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.pair .num { font-family: var(--mono); text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.btrack { position: relative; height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bfill { height: 100%; border-radius: 999px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.list li { border-left: 3px solid var(--crit); padding: 1px 0 1px 10px; font-size: 14px; }
.list li .meta { display: block; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--surface); }
td.name, th.name { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; }
td.c1 { background: var(--h1); } td.c2 { background: var(--h2); } td.c3 { background: var(--h3); } td.c4 { background: var(--h4); }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.comments { display: grid; gap: 10px; }
.comment { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); font-size: 14px; }
.comment b { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
.qlegend { font-size: 12px; color: var(--muted); columns: 2; column-gap: 24px; margin-top: 10px; }
@media (max-width: 760px) { .qlegend { columns: 1; } }
.qlegend div { break-inside: avoid; margin-bottom: 3px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.effin { width: 64px; padding: 2px 6px; font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
.pillset { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pillset button { border: 0; border-radius: 0; padding: 7px 14px; background: var(--surface); color: var(--muted); font-size: 13px; }
.pillset button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.insights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .insights { grid-template-columns: minmax(0, 1fr); } }
.insight { border-left: 3px solid var(--accent); background: var(--bg); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
.insight b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
.gapnum { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lik { display: grid; gap: 7px; }
.likrow { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 46px; gap: 12px; align-items: center; font-size: 13px; }
@media (max-width: 760px) { .likrow { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.likrow .lt { min-width: 0; }
.likbar { display: grid; grid-template-columns: 1fr 1fr; height: 16px; }
.likbar .neg { display: flex; justify-content: flex-end; border-right: 1.5px solid var(--ink); }
.likbar .pos { display: flex; }
.likbar span { height: 100%; }
.likpct { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.likaxis { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) 46px; gap: 12px; font-size: 11px; color: var(--muted); }
.likaxis div:nth-child(2) { display: flex; justify-content: space-between; }
@media (max-width: 760px) { .likaxis { grid-template-columns: minmax(0, 1fr); } .likaxis div:first-child, .likaxis div:last-child { display: none; } }
</style>

const app = document.getElementById("app");
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);

const brandBar = () => el("div", { class: "brandbar" }, el("span", { class: "logo" }, el("img", { src: LOGO, alt: "Swisse Travel", width: "177", height: "42" })), el("span", { class: "tagline", text: "Plus qu'un voyage, une expérience" }));
const clean = s => String(s || "").replace(/[|\r\n]+/g, " ").replace(/\s+/g, " ").trim();

/* ---------- Respondent flow ---------- */
const state = { step: 0, name: "", role: "", answers: new Array(20).fill(null), comment: "" };

function stepBar() { return el("div", { class: "steps", "aria-hidden": "true" }, [0,1,2,3,4,5].map(i => el("span", { class: i <= state.step ? "on" : "" }))); }

function renderRespondent() {
  app.textContent = "";
  const wrap = el("div", { class: "narrow" });
  wrap.append(brandBar());
  wrap.append(el("div", { class: "eyebrow", text: "Accompagnement RH · Diagnostic" }));
  if (state.step === 0) renderIntro(wrap);
  else if (state.step <= 4) renderDim(wrap, state.step - 1);
  else if (state.step === 5) renderComment(wrap);
  else renderThanks(wrap);
  wrap.append(el("div", { class: "footer-link" }, el("span", { class: "muted", text: "Questionnaire proposé par DIGIVAS, cabinet de conseil RH · " }), el("a", { href: "#espace-digivas", text: "Espace DIGIVAS" })));
  app.append(wrap);
  window.scrollTo(0, 0);
}

function renderIntro(wrap) {
  wrap.append(el("h1", { text: "Baromètre de l'organisation" }));
  wrap.append(el("p", { class: "muted", text: "Vingt affirmations sur la façon dont l'agence fonctionne au quotidien. Pour chacune, indiquez si elle correspond à ce que vous vivez. Il n'y a pas de bonne ou de mauvaise réponse : c'est votre regard qui compte." }));
  wrap.append(stepBar());
  const err = el("p", { class: "error", role: "alert" });
  const nameIn = el("input", { type: "text", id: "nom", autocomplete: "name", maxlength: "60", placeholder: "Ex. Fatima Zahra Alaoui", value: state.name });
  const seg = el("div", { class: "seg", role: "radiogroup", "aria-label": "Profil" },
    ["Direction", "Équipe"].flatMap((r, i) => {
      const inp = el("input", { type: "radio", name: "role", id: "role-" + i, value: r });
      if (state.role === r) inp.checked = true;
      return [inp, el("label", { for: "role-" + i, text: r === "Direction" ? "Direction" : "Membre de l'équipe" })];
    }));
  const card = el("div", { class: "card" },
    el("div", { class: "field" }, el("label", { for: "nom", text: "Votre prénom et votre nom" }), nameIn),
    el("div", { class: "field" }, el("span", { style: "font-weight:600", text: "Vous répondez en tant que" }), seg),
    el("p", { class: "small", text: "Vos réponses individuelles sont lues uniquement par le cabinet DIGIVAS. Elles servent à préparer le diagnostic de l'organisation, pas à évaluer les personnes, et sont présentées à la direction de façon regroupée, dans le respect de la loi 09-08 sur la protection des données personnelles." }),
    el("p", { class: "small", text: "Durée : 5 minutes environ, en 5 étapes." }),
    err,
    el("div", { class: "nav" }, el("span"), el("button", { class: "primary", text: "Commencer", onclick: () => {
      const role = document.querySelector('input[name="role"]:checked');
      state.name = clean(nameIn.value);
      if (state.name.length < 2) { err.textContent = "Indiquez votre prénom et votre nom pour continuer."; nameIn.focus(); return; }
      if (!role) { err.textContent = "Choisissez votre profil pour continuer."; return; }
      state.role = role.value; state.step = 1; renderRespondent();
    }}))
  );
  wrap.append(card);
}

function renderDim(wrap, d) {
  const dim = DIMS[d];
  wrap.append(el("h1", { text: dim.name }));
  wrap.append(el("p", { class: "muted", text: "Étape " + (d + 1) + " sur 5. Répondez aux cinq affirmations pour continuer." }));
  wrap.append(stepBar());
  const card = el("div", { class: "card" });
  const list = el("div");
  dim.qs.forEach((text, k) => {
    const idx = d * 5 + k;
    const scale = el("div", { class: "scale", role: "radiogroup", "aria-label": text },
      SCALE.flatMap((lab, v) => {
        const id = "q" + idx + "-" + (v + 1);
        const inp = el("input", { type: "radio", name: "q" + idx, id, value: v + 1, onchange: () => { state.answers[idx] = v + 1; err.textContent = ""; } });
        if (state.answers[idx] === v + 1) inp.checked = true;
        return [inp, el("label", { for: id, text: lab })];
      }));
    list.append(el("div", { class: "q" }, el("p", {}, el("span", { class: "qn", text: String(idx + 1).padStart(2, "0") }), text), scale));
  });
  const err = el("p", { class: "error", role: "alert" });
  card.append(list, err, el("div", { class: "nav" },
    el("button", { class: "ghost", text: "Retour", onclick: () => { state.step--; renderRespondent(); } }),
    el("button", { class: "primary", text: "Continuer", onclick: () => {
      const missing = state.answers.slice(d * 5, d * 5 + 5).filter(v => v == null).length;
      if (missing) { err.textContent = missing === 1 ? "Il reste une affirmation sans réponse." : "Il reste " + missing + " affirmations sans réponse."; return; }
      state.step++; renderRespondent();
    }})));
  wrap.append(card);
}

function renderComment(wrap) {
  wrap.append(el("h1", { text: "Une dernière question" }));
  wrap.append(el("p", { class: "muted", text: "Étape 5 sur 5. Cette question est facultative." }));

  const ta = el("textarea", { id: "commentaire", maxlength: "400", placeholder: "Par exemple : savoir qui suit un dossier quand le collègue est absent." });
  ta.value = state.comment;
  const err = el("p", { class: "error", role: "alert" });
  wrap.append(el("div", { class: "card" },
    el("div", { class: "field" }, el("label", { for: "commentaire", text: "Qu'est-ce qui vous ferait gagner le plus de temps ou d'énergie dans votre travail ?" }), ta),
    el("div", { class: "nav" },
      el("button", { class: "ghost", text: "Retour", onclick: () => { state.comment = ta.value; state.step--; renderRespondent(); } }),
      el("button", { class: "primary", id: "send-btn", text: "Envoyer mes réponses", onclick: async (e) => {
        const btn = e.currentTarget; state.comment = clean(ta.value).slice(0, 400);
        btn.disabled = true; btn.textContent = "Envoi en cours…"; err.textContent = "";
        try {
          await sb("digivas_reponses", { mission: MISSION, nom: state.name, profil: state.role, reponses: state.answers.join(""), commentaire: state.comment || null });
          state.step = 6; renderRespondent();
        } catch (x) {
          btn.disabled = false; btn.textContent = "Réessayer l'envoi";
          err.textContent = (x.status === 401 || x.status === 403) ? "Ce questionnaire n'est plus ouvert aux réponses. Contactez le cabinet DIGIVAS." : "L'envoi n'a pas abouti. Vérifiez votre connexion internet, puis réessayez.";
        }
      } })), err));
}

function renderThanks(wrap) {
  wrap.append(el("h1", { text: "Merci " + state.name.split(" ")[0] + "." }));
  wrap.append(el("p", { class: "muted", text: "Vos réponses ont bien été enregistrées. Il n'y a rien d'autre à faire." }));
  wrap.append(stepBar());
  wrap.append(el("div", { class: "card" },
    el("p", { text: "Elles seront analysées avec celles de vos collègues pour préparer le diagnostic de l'organisation. Les résultats seront partagés avec l'équipe de façon regroupée." }),
    el("p", { class: "small", text: "Vous pouvez fermer cette page." })));
}

/* ---------- Espace DIGIVAS ---------- */
let code = "", rows = [], dupes = 0, timer = null;
try { code = sessionStorage.getItem("digivas-code") || ""; } catch (e) {}
const denied = x => x.status === 401 || /acces_refuse/.test(x.message || "");

function renderGate(msg) {
  app.textContent = "";
  const err = el("p", { class: "error", role: "alert", text: msg || "" });
  const inp = el("input", { type: "password", id: "code", autocomplete: "current-password", placeholder: "Code d'accès" });
  const btn = el("button", { class: "primary", text: "Ouvrir" });
  const go = async () => {
    const c = inp.value.trim(); if (!c) { err.textContent = "Saisissez le code d'accès."; return; }
    btn.disabled = true; btn.textContent = "Vérification…";
    try { await load(c); code = c; try { sessionStorage.setItem("digivas-code", c); } catch (e) {} renderConsultant(); }
    catch (x) { btn.disabled = false; btn.textContent = "Ouvrir"; err.textContent = denied(x) ? "Code incorrect." : "Connexion impossible. Vérifiez votre connexion internet."; inp.select(); }
  };
  btn.addEventListener("click", go);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  app.append(el("div", { class: "narrow" }, brandBar(),
    el("div", { class: "eyebrow", text: "DIGIVAS · Cabinet de conseil RH" }),
    el("h1", { text: "Espace DIGIVAS" }),
    el("div", { class: "card" },
      el("div", { class: "field" }, el("label", { for: "code", text: "Code d'accès aux résultats" }), inp),
      el("p", { class: "small", text: "Le code est vérifié par le serveur. Sans lui, aucune réponse n'est accessible." }),
      err,
      el("div", { class: "nav" }, el("a", { href: "#", class: "btn ghost", text: "Retour au questionnaire" }), btn))));
  inp.focus();
}

async function load(c) {
  const data = await sb("rpc/digivas_resultats", { p_mission: MISSION, p_code: c }, "return=representation");
  const seen = new Set(); dupes = 0; rows = [];
  for (const r of data) { // les plus récentes d'abord : on garde la dernière réponse de chaque personne
    const k = slug(r.nom) + "|" + r.profil;
    if (seen.has(k)) { dupes++; continue; }
    seen.add(k); rows.push(r);
  }
  rows.sort((a, b) => (a.profil === b.profil ? a.nom.localeCompare(b.nom, "fr") : a.profil === "Direction" ? -1 : 1));
}

function renderConsultant() {
  app.textContent = "";
  const root = el("div", { class: "wide" });
  app.append(root);
  root.append(brandBar());
  const stamp = el("span", { class: "small" });
  const body = el("div");
  const refresh = async () => {
    try { await load(code); drawResults(body); stamp.textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + " · actualisation automatique chaque minute"; }
    catch (x) { if (denied(x)) { code = ""; try { sessionStorage.removeItem("digivas-code"); } catch (e) {} clearInterval(timer); renderGate("Le code n'est plus valide."); } else stamp.textContent = "Actualisation impossible pour le moment."; }
  };
  window.refreshResults = refresh;
  root.append(el("div", { class: "topbar" },
    el("div", {}, el("div", { class: "eyebrow", text: "Espace DIGIVAS · accès réservé" }), el("h1", { text: "Résultats du baromètre" }), stamp),
    el("div", { class: "nav" },
      el("button", { class: "ghost", text: "Actualiser", onclick: refresh }),
      el("button", { class: "ghost", text: "Télécharger en CSV", onclick: exportCsv }),
      el("button", { class: "ghost", text: "Verrouiller", onclick: () => { code = ""; try { sessionStorage.removeItem("digivas-code"); } catch (e) {} clearInterval(timer); location.hash = ""; } }))));
  root.append(body);
  drawResults(body);
  clearInterval(timer); timer = setInterval(refresh, 60000);
  refresh();
}

const scorePct = arr => { const a = arr.filter(v => v != null); if (!a.length) return null; return Math.round((a.reduce((s, v) => s + v, 0) / a.length - 1) / 3 * 100); };
const color = s => s == null ? "var(--line)" : s < 40 ? "var(--crit)" : s < 70 ? "var(--warn)" : "var(--good)";
const avg = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;

const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "sans-nom";

let filt = "Tous", hideNames = false;
try { hideNames = localStorage.getItem("digivas-anon") === "1"; } catch (e) {}
const lvlLabel = v => v == null ? "–" : v < 40 ? "À structurer" : v < 70 ? "En construction" : "Solide";
const fmt1 = x => x.toFixed(1).replace(".", ",");
const signed = x => (x > 0 ? "+" : "") + x;
const qn = i => "Q" + String(i + 1).padStart(2, "0");

function drawResults(body) {
  body.textContent = "";
  const nums = r => r.reponses.split("").map(Number);
  const dimScore = (list, d) => scorePct(list.flatMap(r => nums(r).slice(d * 5, d * 5 + 5)));
  const allScore = list => scorePct(list.flatMap(nums));
  const qAvg = (list, i) => list.length ? avg(list.map(r => Number(r.reponses[i]))) : null;
  const dir = rows.filter(r => r.profil === "Direction"), eq = rows.filter(r => r.profil === "Équipe");
  const sel = filt === "Direction" ? dir : filt === "Équipe" ? eq : rows;
  const both = dir.length > 0 && eq.length > 0;
  let expected = 0; try { expected = Number(localStorage.getItem("digivas-effectif-" + MISSION)) || 0; } catch (e) {}
  const g = allScore(rows);

  const eff = el("input", { type: "number", id: "effectif", min: "1", max: "500", class: "effin", placeholder: "nb", value: expected || "" });
  eff.addEventListener("change", () => { try { localStorage.setItem("digivas-effectif-" + MISSION, eff.value); } catch (e) {} drawResults(body); });
  body.append(el("div", { class: "kpis" },
    kpi("Réponses reçues", rows.length, dir.length + " direction · " + eq.length + " équipe"),
    el("div", { class: "kpi" }, el("span", { class: "small", text: "Taux de participation" }), el("span", { class: "v", text: expected ? Math.min(100, Math.round(rows.length / expected * 100)) + " %" : "–" }), el("label", { class: "sub", for: "effectif" }, "sur un effectif de ", eff)),
    kpi("Score global / 100", g ?? "–", lvlLabel(g)),
    kpi("Écart direction – équipe", both ? signed(allScore(dir) - allScore(eq)) : "–", both ? "points sur 100, direction moins équipe" : "il faut une réponse de chaque profil")));

  if (!rows.length) {
    body.append(el("div", { class: "card empty" }, el("p", { text: "Aucune réponse pour l'instant. Dès qu'un membre de l'équipe envoie le questionnaire, sa réponse apparaît ici : scores, écart entre direction et équipe, priorités et carte des réponses." })));
    return;
  }

  // ---- ce qu'il faut retenir (sur l'ensemble des réponses)
  const ds = DIMS.map((d, i) => ({ d, i, v: dimScore(rows, i) })).sort((a, b) => a.v - b.v);
  const negShare = (list, i) => list.length ? list.filter(r => Number(r.reponses[i]) <= 2).length / list.length : 0;
  const qs = ALLQ.map((t, i) => ({ t, i, n: negShare(rows, i), a: qAvg(rows, i) })).sort((a, b) => b.n - a.n || a.a - b.a || a.i - b.i);
  const worstQ = qs[0], ties = qs.filter(o => o.n === worstQ.n && o.a === worstQ.a).length - 1;
  const nb = ["", "une autre", "deux autres", "trois autres", "quatre autres", "cinq autres"];
  const ins = [
    ["Priorité n°1", ds[0].d.name + " : " + ds[0].v + " sur 100, niveau « " + lvlLabel(ds[0].v).toLowerCase() + " »."],
    ["Point d'appui", ds[ds.length - 1].d.name + " : " + ds[ds.length - 1].v + " sur 100, la dimension la mieux notée."],
    [ties ? "Affirmations les plus contestées" : "Affirmation la plus contestée", "« " + worstQ.t + " »" + (ties ? " et " + (nb[ties] || ties + " autres") + " à égalité" : "") + " : " + Math.round(worstQ.n * 100) + " % des répondants ne sont pas d'accord" + (ties ? ", voir la répartition ci-dessous." : ".")]
  ];
  if (both) {
    const gq = ALLQ.map((t, i) => ({ t, i, gap: qAvg(dir, i) - qAvg(eq, i) })).sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap))[0];
    ins.push(["Plus grand écart de perception", Math.abs(gq.gap) < 0.5 ? "La direction et l'équipe voient les choses de la même façon, sans écart notable." : "« " + gq.t + " » : " + fmt1(qAvg(dir, gq.i)) + " pour la direction contre " + fmt1(qAvg(eq, gq.i)) + " pour l'équipe, sur 4."]);
  } else ins.push(["Écart de perception", "Il apparaîtra dès qu'au moins une réponse de la direction et une de l'équipe auront été reçues."]);
  if (rows.length < 3) ins.push(["Prudence", "Moins de trois réponses : ces résultats ne sont pas encore représentatifs."]);
  body.append(el("div", { class: "card", style: "margin-bottom:16px" }, el("h3", { text: "Ce qu'il faut retenir" }), el("div", { class: "insights" }, ins.map(([h, t]) => el("div", { class: "insight" }, el("b", { text: h }), t)))));

  // ---- barre d'outils
  const pills = el("div", { class: "pillset", role: "group", "aria-label": "Filtrer par profil" }, ["Tous", "Direction", "Équipe"].map(f => el("button", { type: "button", "aria-pressed": String(filt === f), text: f + (f === "Tous" ? " (" + rows.length + ")" : f === "Direction" ? " (" + dir.length + ")" : " (" + eq.length + ")"), onclick: () => { filt = f; drawResults(body); } })));
  const anon = el("input", { type: "checkbox", id: "anon" }); anon.checked = hideNames;
  anon.addEventListener("change", () => { hideNames = anon.checked; try { localStorage.setItem("digivas-anon", hideNames ? "1" : "0"); } catch (e) {} drawResults(body); });
  body.append(el("div", { class: "toolbar" }, el("div", { class: "nav" }, el("span", { class: "small", text: "Afficher :" }), pills), el("label", { class: "toggle", for: "anon" }, anon, "Masquer les noms (pour présenter à la direction)")));

  // ---- dimensions
  const dims = el("div", { class: "card" }, el("h3", { text: "Scores par dimension" }));
  DIMS.forEach((d, i) => {
    const sd = dimScore(dir, i), se = dimScore(eq, i);
    dims.append(el("div", { class: "dimrow" }, el("div", { class: "dimtop" }, el("span", { text: d.name }), el("span", { class: "gapnum", text: (sd != null && se != null) ? "écart " + signed(sd - se) : "" })),
      pair("Direction", sd), pair("Équipe", se)));
  });
  dims.append(el("div", { class: "legend" }, el("span", {}, el("i", { style: "background:var(--crit)" }), "À structurer, moins de 40"), el("span", {}, el("i", { style: "background:var(--warn)" }), "En construction"), el("span", {}, el("i", { style: "background:var(--good)" }), "Solide, 70 et plus")));

  const weakest = ALLQ.map((t, i) => ({ t, i, a: qAvg(sel, i) })).filter(o => o.a != null).sort((x, y) => x.a - y.a || x.i - y.i).slice(0, 5);
  const right = el("div", { class: "stack" }, el("div", { class: "card" }, el("h3", { text: "Les cinq points les plus faibles" + (filt === "Tous" ? "" : " · " + filt) }),
    sel.length ? el("ul", { class: "list" }, weakest.map(o => el("li", {}, o.t, el("span", { class: "meta", text: qn(o.i) + " · moyenne " + fmt1(o.a) + " sur 4" })))) : el("p", { class: "small", text: "Aucune réponse pour ce profil." })));
  if (both) {
    const gaps = ALLQ.map((t, i) => ({ t, i, g: qAvg(dir, i) - qAvg(eq, i) })).filter(o => Math.abs(o.g) >= 1).sort((x, y) => Math.abs(y.g) - Math.abs(x.g)).slice(0, 5);
    right.append(el("div", { class: "card" }, el("h3", { text: "Où la direction et l'équipe voient les choses différemment" }),
      gaps.length ? el("ul", { class: "list" }, gaps.map(o => el("li", { style: "border-color:var(--warn)" }, o.t, el("span", { class: "meta", text: qn(o.i) + " · direction " + fmt1(qAvg(dir, o.i)) + ", équipe " + fmt1(qAvg(eq, o.i)) + (o.g > 0 ? " · la direction est plus positive" : " · l'équipe est plus positive") }))))
      : el("p", { class: "small", text: "Aucun écart d'un point ou plus sur l'échelle de 1 à 4." })));
  }
  body.append(el("div", { class: "grid2" }, dims, right));

  // ---- répartition des réponses (barres divergentes)
  if (sel.length) {
    const share = (i, v) => sel.filter(r => Number(r.reponses[i]) === v).length / sel.length * 100;
    const items = ALLQ.map((t, i) => ({ t, i, s: [1, 2, 3, 4].map(v => share(i, v)) })).sort((a, b) => (b.s[0] + b.s[1]) - (a.s[0] + a.s[1]) || a.i - b.i);
    const seg = (w, v) => el("span", { style: "width:" + w + "%;background:var(--l" + v + ")", title: SCALE[v - 1] + " : " + Math.round(w * 2) / 2 + " %" });
    const lik = el("div", { class: "lik" },
      el("div", { class: "likaxis" }, el("div"), el("div", {}, el("span", { text: "← pas d'accord" }), el("span", { text: "d'accord →" })), el("div", { text: "accord" })),
      items.map(o => el("div", { class: "likrow" },
        el("div", { class: "lt" }, el("span", { class: "qn", text: qn(o.i) }), o.t),
        el("div", { class: "likbar", role: "img", "aria-label": o.t + " : " + Math.round(o.s[2] + o.s[3]) + " % d'accord" },
          el("div", { class: "neg" }, seg(o.s[0], 1), seg(o.s[1], 2)),
          el("div", { class: "pos" }, seg(o.s[2], 3), seg(o.s[3], 4))),
        el("div", { class: "likpct", text: Math.round(o.s[2] + o.s[3]) + " %" }))));
    body.append(el("div", { class: "card", style: "margin-bottom:16px" },
      el("h3", { text: "Répartition des réponses, de la plus contestée à la plus partagée" + (filt === "Tous" ? "" : " · " + filt) }),
      el("div", { class: "legend" }, SCALE.map((l, k) => el("span", {}, el("i", { style: "background:var(--l" + (k + 1) + ")" }), l))),
      lik));
  }

  // ---- carte des réponses
  const who = (r, k) => hideNames ? r.profil + " " + (k + 1) : r.nom;
  const head = el("tr", {}, el("th", { class: "name", text: hideNames ? "Répondant" : "Personne" }), el("th", { text: "Profil" }), ALLQ.map((_, i) => el("th", { title: ALLQ[i], text: qn(i) })), DIMS.map((d, k) => el("th", { title: d.name, text: "D" + (k + 1) })), el("th", { text: "Global" }), hideNames ? null : el("th"));
  const counters = { Direction: 0, "Équipe": 0 };
  const trs = sel.map(r => el("tr", {},
    el("td", { class: "name", text: who(r, counters[r.profil]++) }), el("td", {}, el("span", { class: "tag", text: r.profil })),
    nums(r).map(v => el("td", { class: "c" + v, text: v })),
    DIMS.map((_, i) => el("td", { class: "num", text: scorePct(nums(r).slice(i * 5, i * 5 + 5)) })),
    el("td", { class: "num", style: "font-weight:600", text: scorePct(nums(r)) }),
    hideNames ? null : el("td", {}, delBtn(r))));
  const avgRow = sel.length ? el("tr", {}, el("td", { class: "name", style: "font-weight:600", text: "Moyenne" }), el("td"), ALLQ.map((_, i) => el("td", { class: "num", text: fmt1(qAvg(sel, i)) })), DIMS.map((_, i) => el("td", { class: "num", text: dimScore(sel, i) })), el("td", { class: "num", style: "font-weight:600", text: allScore(sel) }), hideNames ? null : el("td")) : null;
  const legend = el("div", { class: "qlegend" },
    DIMS.map((d, k) => el("div", {}, el("span", { class: "qn", text: "D" + (k + 1) }), d.name)),
    ALLQ.map((t, i) => el("div", {}, el("span", { class: "qn", text: qn(i) }), t)));
  body.append(el("div", { class: "card", style: "margin-bottom:16px" }, el("h3", { text: "Carte des réponses" + (filt === "Tous" ? "" : " · " + filt) }),
    el("div", { class: "legend" }, SCALE.map((l, k) => el("span", {}, el("i", { style: "background:var(--h" + (k + 1) + ")" }), (k + 1) + " " + l))),
    el("div", { class: "tablewrap" }, el("table", {}, el("thead", {}, head), el("tbody", {}, trs, avgRow))), legend));

  // ---- commentaires
  const coms = sel.filter(r => r.commentaire);
  body.append(el("div", { class: "card", style: "margin-bottom:16px" }, el("h3", { text: "Ce qui ferait gagner du temps, selon chacun" }),
    coms.length ? el("div", { class: "comments" }, coms.map(r => el("div", { class: "comment" }, el("b", { text: hideNames ? r.profil : r.nom + " · " + r.profil }), r.commentaire))) : el("p", { class: "small", text: "Aucun commentaire reçu." })));
  if (dupes) body.append(el("p", { class: "small", text: dupes + (dupes > 1 ? " réponses en double ont été ignorées" : " réponse en double a été ignorée") + " : seule la plus récente de chaque personne est prise en compte." }));
}

function kpi(label, v, sub) { return el("div", { class: "kpi" }, el("span", { class: "small", text: label }), el("span", { class: "v", text: v }), sub ? el("span", { class: "sub", text: sub }) : null); }
function pair(label, s) {
  return el("div", { class: "pair" }, el("span", { text: label }),
    el("div", { class: "btrack" }, el("div", { class: "bfill", style: "width:" + (s ?? 0) + "%;background:" + color(s) })),
    el("span", { class: "num", text: s ?? "–" }));
}
function delBtn(r) {
  let armed = false;
  const b = el("button", { class: "danger", text: "Retirer", onclick: async () => {
    if (!armed) { armed = true; b.textContent = "Confirmer"; setTimeout(() => { armed = false; b.textContent = "Retirer"; }, 4000); return; }
    b.disabled = true; try { await sb("rpc/digivas_supprimer", { p_mission: MISSION, p_code: code, p_id: r.id }); window.refreshResults && window.refreshResults(); } catch (e) { b.disabled = false; b.textContent = "Échec"; }
  }});
  return b;
}
function exportCsv() {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [["Date", "Nom", "Profil", ...ALLQ.map((_, i) => "Q" + (i + 1)), ...DIMS.map(d => d.name), "Global", "Commentaire"].map(q).join(";")];
  rows.forEach(r => { const n = r.reponses.split("").map(Number); lines.push([new Date(r.created_at).toLocaleString("fr-FR"), r.nom, r.profil, ...n, ...DIMS.map((_, i) => scorePct(n.slice(i * 5, i * 5 + 5))), scorePct(n), r.commentaire || ""].map(q).join(";")); });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
  a.download = "barometre-" + MISSION + ".csv"; document.body.append(a); a.click(); a.remove();
}

function route() {
  if (location.hash === "#espace-digivas") { code ? renderConsultant() : renderGate(); }
  else { clearInterval(timer); renderRespondent(); }
}
window.addEventListener("hashchange", route);
route();
